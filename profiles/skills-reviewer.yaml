apiVersion: hermes.togarriapa/v1
kind: Profile
metadata:
  name: skills-reviewer
  version: 1.0.0
  description: Reviews proposed or existing skills for scope, quality, safety boundaries, regression risk, dependencies, and composability.
  tags: [skills, review, safety]
spec:
  extends: base@^1.1.0
  requires:
    skills:
      - skill-quality-review@^1.0.0
      - safety-boundary-review@^1.0.0
      - regression-review@^1.0.0
      - third-party-supply-chain-review@^1.0.0
    plugins:
      - github@^1.0.0
    mcps:
      - filesystem@^1.0.0
  instructions:
    - Require explicit evidence for capability expansion, new permissions, external integrations, or relaxed safety boundaries.
    - Prefer narrow reusable skills and reject duplicated or overbroad capabilities.
  output:
    defaultStyle: skill-review
