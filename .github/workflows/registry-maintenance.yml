name: Registry maintenance audit

on:
  schedule:
    - cron: "17 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: registry-maintenance-main
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Compile scripts
        run: python -m compileall -q scripts
      - name: Audit catalog and registry
        run: |
          python scripts/check_catalog_consistency.py
          python scripts/validate_registry.py
          python scripts/validate_deliberation.py
          python scripts/validate_expansion_v21.py
          python scripts/validate_expansion_v22.py
          python scripts/validate_quality_v22.py
          python scripts/validate_quality_overlays_v22.py
          python scripts/materialize_effective_registry.py --check-only
      - name: Build update-notice fixture
        run: python scripts/build_update_notice.py --output /tmp/registry-update.json
